include:
  - user.yaml

# policy over a richer user struct
# the host writes a user record into linear memory; the workflow reads fields
# and enforces a compound policy: age >= 21, not a CA resident, membership required
# the host supplies the data; the workflow supplies the policy

module: $access_check_with_struct

memory $mem:
  !use user_mem

import $get_user:
  !use import_get_user

import $grant:
  !use import_grant

import $deny:
  !use import_deny

func $check_access:
  export: true
  param: [$user_id i32]
  local: [$ptr i32]
  body:
    # ask the host to write the user struct at our scratch address (offset 0)
    - i32.const 0
    - local.set $ptr
    - local.get $user_id
    - local.get $ptr
    - call $get_user

    - block $denied:
        # age >= 21
        - !use {user_age: [$ptr]}
        - i32.const 21
        - i32.lt_s
        - br_if $denied

        # residence != 1 (CA)
        - !use {user_residence: [$ptr]}
        - i32.const 1
        - i32.eq
        - br_if $denied

        # membership_tier >= 1 (basic or premium)
        - !use {user_membership_tier: [$ptr]}
        - i32.const 1
        - i32.lt_s
        - br_if $denied

        - local.get $user_id
        - call $grant
        - return

    - local.get $user_id
    - call $deny
