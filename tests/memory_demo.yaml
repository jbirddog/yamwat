module: $memory_demo

memory $mem:
  pages: 1
  export: mem

data:
  - offset: 0
    string: "hello"
  - offset: 16
    bytes: [0xFF, 0x00, 0x2A]

func $read_byte:
  export: true
  param: [$addr i32]
  result: i32
  body:
    - local.get $addr
    - i32.load8_u

func $write_byte:
  export: true
  param: [$addr i32, $val i32]
  body:
    - local.get $addr
    - local.get $val
    - i32.store8
