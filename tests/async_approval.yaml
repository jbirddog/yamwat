# async_approval.yaml — a continuation workflow using function table callbacks
# an expense report moves through manager approval then finance review
# the workflow owns the sequencing; the host owns async execution
# the host supplies capabilities; the workflow supplies policy and order

module: $async_approval

# --- types ---
# two signatures are needed for call_indirect on the host side

type $entry_t:
  param: [$report_id i32]

type $decision_t:
  param: [$report_id i32, $approved i32]

# --- table ---
# the host calls back into the workflow via this table
# index 0: process_report      (i32) -> ()       initial entry point
# index 1: on_manager_decision (i32, i32) -> ()  callback after manager acts
# index 2: on_finance_decision (i32, i32) -> ()  callback after finance acts

table $callbacks:
  size: 3
  type: funcref
  export: callbacks

elem $callbacks:
  offset: 0
  funcs: [$process_report, $on_manager_decision, $on_finance_decision]

# --- imports ---

import $validate_report:
  from: [env, validate_report]
  param: [$report_id i32]
  result: i32

import $request_manager_approval:
  from: [env, request_manager_approval]
  param: [$report_id i32, $callback_index i32]

import $request_finance_review:
  from: [env, request_finance_review]
  param: [$report_id i32, $callback_index i32]

import $confirm_report:
  from: [env, confirm_report]
  param: [$report_id i32]

import $decline_report:
  from: [env, decline_report]
  param: [$report_id i32]

# --- entry point ---

func $process_report:
  export: True
  param: [$report_id i32]
  body:
    - local.get $report_id
    - call $validate_report
    - i32.eqz
    - if:
        then:
          - local.get $report_id
          - call $decline_report
          - return
    - local.get $report_id
    - i32.const 1           # callback index: on_manager_decision
    - call $request_manager_approval

# --- callbacks ---

func $on_manager_decision:
  export: True
  param: [$report_id i32, $approved i32]
  body:
    - local.get $approved
    - i32.eqz
    - if:
        then:
          - local.get $report_id
          - call $decline_report
          - return
    - local.get $report_id
    - i32.const 2           # callback index: on_finance_decision
    - call $request_finance_review

func $on_finance_decision:
  export: True
  param: [$report_id i32, $approved i32]
  body:
    - local.get $approved
    - i32.eqz
    - if:
        then:
          - local.get $report_id
          - call $decline_report
          - return
    - local.get $report_id
    - call $confirm_report
