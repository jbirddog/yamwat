module: $snippet_test

macros:
  guard_positive:
    - i32.const 0
    - i32.lt_s
    - br_if $abort

  clamp_to_zero:
    - if:
        result: i32
        then:
          - i32.const 0
        else:
          - local.get $x

func $safe_double:
  export: true
  param: [$x i32]
  result: i32
  body:
    - block $abort:
        - local.get $x
        - !use guard_positive
        - local.get $x
        - i32.const 2
        - i32.mul
        - return
    - i32.const -1

func $clamp_and_double:
  export: true
  param: [$x i32]
  result: i32
  body:
    - local.get $x
    - i32.const 0
    - i32.lt_s
    - !use clamp_to_zero
    - i32.const 2
    - i32.mul
