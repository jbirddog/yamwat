!include env.logging.yaml
!include env.signatures.yaml

---
module: $math

import $log:
  <<: *import_log

type $return_i32:
  result: i32

func $double:
  <<: *sig_i32_to_i32
  export: True
  body:
    - local.get $x
    - i32.const 2
    - i32.mul

func $factorial:
  export: True
  param: [$n i32]
  result: i32
  local: [$result i32]
  body:
    - i32.const 1
    - local.set $result
    - block $done:
        - loop $top:
            - local.get $n
            - i32.const 1
            - i32.le_s
            - br_if $done
            - local.get $result
            - local.get $n
            - i32.mul
            - local.set $result
            - local.get $n
            - i32.const 1
            - i32.sub
            - local.set $n
            - br $top
    - local.get $result

func $abs:
  export: True
  <<: *sig_i32_to_i32
  body:
    - local.get $x
    - i32.const 0
    - i32.lt_s
    - if:
        result: i32
        then:
          - i32.const 0
          - local.get $x
          - i32.sub
        else:
          - local.get $x
    - !raw ";; abs result now on stack"

func $init:
  body:
    - i32.const 0
    - call $log

start: $init
