# env.yaml — shared host imports and common signatures
# include this file before any module that talks to the host environment

definitions:
  imports:
    log: &import_log
      from: [env, log]
      param: [$x i32]

  signatures:
    i32_to_i32: &sig_i32_to_i32
      param: [$x i32]
      result: i32

    void_to_i32: &sig_void_to_i32
      result: i32
