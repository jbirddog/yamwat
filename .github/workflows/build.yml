name: build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: build image
        run: docker build -t yamwat .

      - name: compile and assemble
        run: docker run --rm -v ${{ github.workspace }}:/src yamwat

      - name: upload wasm artifacts
        uses: actions/upload-artifact@v4
        with:
          name: wasm
          path: "*.wasm"
