include:
  - post.yaml
  - verdicts.yaml

# strict content moderation policy
# intended for communities that require tighter moderation standards
#
# decision order (first match wins):
#   1. remove    — flag_count >= 3
#   2. escalate  — is_repost (any repost, regardless of flags)
#   3. hold      — author_tier < 2 (only trusted authors pass)
#   4. hold      — score <= 0
#   5. approve   — default

module: $strict_policy

memory $mem:
  !use post_mem

import $get_post:
  !use import_get_post

func $moderate:
  !use moderate_func:
  body:
    - !use {load_post: [$post, $post_id]}

    # remove if flag_count >= 3
    - !use {post_flag_count: [$post]}
    - i32.const 3
    - i32.ge_s
    - if:
        - !use verdict_remove
        - return

    # escalate any repost regardless of flags
    - !use {post_is_repost: [$post]}
    - if:
        - !use verdict_escalate
        - return

    # hold if author_tier < 2 (only trusted authors pass)
    - !use {post_author_tier: [$post]}
    - i32.const 2
    - i32.lt_s
    - if:
        - !use verdict_hold
        - return

    # hold if score <= 0
    - !use {post_score: [$post]}
    - i32.const 0
    - i32.le_s
    - if:
        - !use verdict_hold
        - return

    # default: approve
    - !use verdict_approve
