!include host/post.yaml

---
# strict_policy.yaml — strict content moderation policy
# intended for communities that require tighter moderation standards
# host associates community_id -> this policy at load time
#
# decision order (first match wins):
#   1. remove    — flag_count >= 3
#   2. escalate  — is_repost (any repost, regardless of flags)
#   3. hold      — author_tier < 2 (new or established, trusted only)
#   4. hold      — score <= 0
#   5. approve   — default

module: $strict_policy

memory $mem:
  <<: *post_mem

import $get_post:
  <<: *import_get_post

import $approve:
  <<: *import_approve

import $hold:
  <<: *import_hold

import $remove:
  <<: *import_remove

import $escalate:
  <<: *import_escalate

func $moderate:
  <<: *moderate_func
  body:
    - *load_post

    # remove if flag_count >= 3
    - *post_flag_count
    - i32.const 3
    - i32.ge_s
    - if:
        - local.get $post_id
        - call $remove
        - return

    # escalate any repost regardless of flags
    - *post_is_repost
    - if:
        - local.get $post_id
        - call $escalate
        - return

    # hold if author_tier < 2 (only trusted authors pass)
    - *post_author_tier
    - i32.const 2
    - i32.lt_s
    - if:
        - local.get $post_id
        - call $hold
        - return

    # hold if score <= 0
    - *post_score
    - i32.const 0
    - i32.le_s
    - if:
        - local.get $post_id
        - call $hold
        - return

    # default: approve
    - local.get $post_id
    - call $approve
