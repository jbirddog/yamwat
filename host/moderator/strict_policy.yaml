!include host/post.yaml

---
# strict_policy.yaml — strict content moderation policy
# intended for communities that require tighter moderation standards
# host associates community_id -> this policy at load time
#
# decision order (first match wins):
#   1. remove    — flag_count >= 3
#   2. escalate  — is_repost (any repost, regardless of flags)
#   3. hold      — author_tier < 2 (new or established, trusted only)
#   4. hold      — score <= 0
#   5. approve   — default

module: $strict_policy

memory $mem:
  pages: 1
  export: mem

import $get_post:
  <<: *import_get_post

import $approve:
  <<: *import_approve

import $hold:
  <<: *import_hold

import $remove:
  <<: *import_remove

import $escalate:
  <<: *import_escalate

func $moderate:
  export: True
  param: [$post_id i32]
  local: [$ptr i32]
  body:
    # load post struct into scratch memory
    - i32.const 0
    - local.set $ptr
    - local.get $post_id
    - local.get $ptr
    - call $get_post

    # remove if flag_count >= 3
    - local.get $ptr
    - *post_flag_count
    - i32.const 3
    - i32.ge_s
    - if:
        then:
          - local.get $post_id
          - call $remove
          - return

    # escalate any repost regardless of flags
    - local.get $ptr
    - *post_is_repost
    - if:
        then:
          - local.get $post_id
          - call $escalate
          - return

    # hold if author_tier < 2 (only trusted authors pass)
    - local.get $ptr
    - *post_author_tier
    - i32.const 2
    - i32.lt_s
    - if:
        then:
          - local.get $post_id
          - call $hold
          - return

    # hold if score <= 0
    - local.get $ptr
    - *post_score
    - i32.const 0
    - i32.le_s
    - if:
        then:
          - local.get $post_id
          - call $hold
          - return

    # default: approve
    - local.get $post_id
    - call $approve
