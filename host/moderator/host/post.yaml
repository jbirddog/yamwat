# Post struct layout written by the host into wasm linear memory.
#
#   offset  field          type
#   ------  -----          ----
#        0  score          i32
#        4  flag_count     i32
#        8  word_count     i32
#       12  author_tier    i32    0=new, 1=established, 2=trusted
#       16  is_repost      i32
#       20  community_id   i32
#       24  author_id      i32
#
# Scratch address: offset 0 in linear memory is the single struct slot.
# Only one post is in flight at a time.

load_post:
  params: [$post, $post_id]
  body:
    - i32.const 0
    - local.set $post
    - local.get $post_id
    - local.get $post
    - call $get_post

post_score:
  params: [$post]
  body:
    - local.get $post
    - i32.load

post_flag_count:
  params: [$post]
  body:
    - local.get $post
    - !raw "i32.load offset=4"

post_word_count:
  params: [$post]
  body:
    - local.get $post
    - !raw "i32.load offset=8"

post_author_tier:
  params: [$post]
  body:
    - local.get $post
    - !raw "i32.load offset=12"

post_is_repost:
  params: [$post]
  body:
    - local.get $post
    - !raw "i32.load offset=16"

moderate_func:
  export: true
  param: [$post_id i32]
  result: i32
  local: [$post i32]

import_get_post:
  from: [env, get_post]
  param: [$post_id i32, $ptr i32]

post_mem:
  pages: 1
  export: mem
