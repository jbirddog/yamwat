!include host/post.yaml
!include host/verdicts.yaml

---
# standard_policy.yaml — baseline content moderation policy
# permissive defaults: only removes heavily flagged content,
# holds new authors and deeply negative posts, approves everything else
#
# decision order (first match wins):
#   1. remove    — flag_count >= 10
#   2. escalate  — is_repost AND flag_count > 0
#   3. hold      — author_tier < 1 (new account)
#   4. hold      — score <= -10
#   5. approve   — default

module: $standard_policy

memory $mem:
  <<: *post_mem

import $get_post:
  <<: *import_get_post

func $moderate:
  <<: *moderate_func
  body:
    - *load_post

    # remove if flag_count >= 10
    - *post_flag_count
    - i32.const 10
    - i32.ge_s
    - if:
        - *verdict_remove
        - return

    # escalate if is_repost AND flag_count > 0
    - *post_is_repost
    - *post_flag_count
    - i32.const 0
    - i32.gt_s
    - i32.and
    - if:
        - *verdict_escalate
        - return

    # hold if author_tier < 1 (new account)
    - *post_author_tier
    - i32.const 1
    - i32.lt_s
    - if:
        - *verdict_hold
        - return

    # hold if score <= -10
    - *post_score
    - i32.const -10
    - i32.le_s
    - if:
        - *verdict_hold
        - return

    # default: approve
    - *verdict_approve
