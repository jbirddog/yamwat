include:
  - post.yaml
  - verdicts.yaml

# baseline content moderation policy
# permissive defaults: only removes heavily flagged content,
# holds new authors and deeply negative posts, approves everything else
#
# decision order (first match wins):
#   1. remove    — flag_count >= 10
#   2. escalate  — is_repost AND flag_count > 0
#   3. hold      — author_tier < 1 (new account)
#   4. hold      — score <= -10
#   5. approve   — default

module: $standard_policy

memory $mem:
  !use post_mem

import $get_post:
  !use import_get_post

func $moderate:
  !use moderate_func:
  body:
    - !use {load_post: [$post, $post_id]}

    # remove if flag_count >= 10
    - !use {post_flag_count: [$post]}
    - i32.const 10
    - i32.ge_s
    - if:
        - !use verdict_remove
        - return

    # escalate if is_repost AND flag_count > 0
    - !use {post_is_repost: [$post]}
    - !use {post_flag_count: [$post]}
    - i32.const 0
    - i32.gt_s
    - i32.and
    - if:
        - !use verdict_escalate
        - return

    # hold if author_tier < 1 (new account)
    - !use {post_author_tier: [$post]}
    - i32.const 1
    - i32.lt_s
    - if:
        - !use verdict_hold
        - return

    # hold if score <= -10
    - !use {post_score: [$post]}
    - i32.const -10
    - i32.le_s
    - if:
        - !use verdict_hold
        - return

    # default: approve
    - !use verdict_approve
