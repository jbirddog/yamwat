# memory_demo.yaml — linear memory, data segments, load/store
# demonstrates: memory, data with string and bytes, i32.load8_u, i32.store

---
module: $memory_demo

memory $mem:
  pages: 1
  export: mem

data:
  - offset: 0
    string: "hello"
  - offset: 16
    bytes: [0xFF, 0x00, 0x2A]

func $read_byte (export "read_byte"):
  param: [$addr i32]
  result: i32
  body:
    - local.get $addr
    - i32.load8_u 0

func $write_byte (export "write_byte"):
  param: [$addr i32, $val i32]
  body:
    - local.get $addr
    - local.get $val
    - i32.store8 0
